name: Audit Chaos

# Nur fuer den Test-Branch: baut die Debug-Variante und laesst monkey auf einem Emulator laufen.
# Kein Release, keine Artefakte mit Inhalten. Ergebnisse erscheinen als Annotationen des Laufs.
on:
  push:
    branches: [audit/tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monkey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pixel_6
            api: 34
          - profile: pixel_c
            api: 34
          - profile: pixel_6
            api: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit-Tests (Audit) und Debug bauen
        run: |
          gradle assembleDebug --stacktrace --no-parallel
          gradle testDebugUnitTest --continue --no-parallel || true
          python3 - <<'PY'
          import glob, re
          fails = []
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              s = open(f, encoding="utf-8").read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure', s):
                  fails.append(m.group(2).split(".")[-1] + "." + m.group(1))
          print(f"::notice title=Unit-Tests::{len(fails)} rote Tests: " + ", ".join(fails)[:3500])
          PY

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Monkey auf dem Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/audit/monkey.sh ${{ matrix.profile }}-${{ matrix.api }}
